<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion - Gerardson Capital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: #F5F7FA; color: #0A1B33; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
  .page { min-height: 100vh; display: flex; flex-wrap: wrap; align-items: stretch; }
  .brand-panel { flex: 1 1 480px; min-width: 0; background: #0A1B33; color: #FFFFFF; padding: 64px; display: flex; flex-direction: column; justify-content: space-between; gap: 64px; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand svg { flex: none; }
  .brand-name { font-size: 32px; line-height: 32px; font-weight: 600; letter-spacing: -0.02em; }
  .brand-sub { margin-top: 6px; font-size: 11px; line-height: 11px; font-weight: 500; letter-spacing: 0.36em; color: #B8C4D6; }
  .pitch { display: flex; flex-direction: column; gap: 16px; max-width: 520px; }
  .pitch h2 { margin: 0; font-size: 40px; line-height: 48px; font-weight: 700; letter-spacing: -0.02em; }
  .pitch p { margin: 0; font-size: 16px; line-height: 24px; color: #B8C4D6; }
  .legal { font-size: 14px; line-height: 20px; color: #B8C4D6; }
  main { flex: 1 1 480px; min-width: 0; padding: 64px 32px; display: flex; align-items: center; justify-content: center; }
  .box { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 32px; }
  .box header { display: flex; flex-direction: column; gap: 8px; }
  .box h1 { margin: 0; font-size: 32px; line-height: 40px; font-weight: 600; letter-spacing: -0.01em; }
  .box header p { margin: 0; font-size: 16px; line-height: 24px; color: #3A4A63; }
  form { display: flex; flex-direction: column; gap: 24px; }
  .field { display: flex; flex-direction: column; gap: 8px; }
  label { font-size: 14px; line-height: 20px; font-weight: 600; }
  input { width: 100%; height: 44px; padding: 0 12px; border: 1px solid #7B8AA0; border-radius: 4px; font: inherit; font-size: 16px; color: #0A1B33; background: #FFFFFF; }
  input:focus { outline: none; border: 2px solid #1A56B0; padding: 0 11px; box-shadow: 0 0 0 3px #E6EEFB; }
  .password { position: relative; }
  .password input { padding-right: 52px; }
  .password input:focus { padding-right: 51px; }
  .toggle { position: absolute; right: 0; top: 0; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 0; background: transparent; color: #3A4A63; cursor: pointer; }
  .toggle:focus-visible, .submit:focus-visible { outline: 2px solid #1A56B0; outline-offset: 2px; }
  .submit { height: 48px; border: 0; border-radius: 8px; background: #1A56B0; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer; }
  .submit:hover { background: #154790; }
  .notice { padding: 12px 16px; border-radius: 8px; font-size: 14px; line-height: 20px; }
  .notice-error { background: #FDE8E8; color: #9B1C1C; }
  .notice-info { background: #E6EEFB; color: #0A1B33; }
  .help { padding-top: 24px; border-top: 1px solid #D9DFE8; font-size: 14px; line-height: 20px; color: #5B6B82; }
  @media (max-width: 720px) { .brand-panel { padding: 32px; gap: 32px; } .pitch h2 { font-size: 32px; line-height: 40px; } }
</style>
</head>
<body>
<div class="page">
  <section class="brand-panel">
    <div class="brand">
      <svg width="56" height="56" viewBox="0 0 64 64" fill="none" role="img" aria-label="Symbole Gerardson Capital"><path d="M44.9 16.7A20 20 0 1 0 52 32H34" stroke="#FFFFFF" stroke-width="8"></path><circle cx="53" cy="14" r="4.5" fill="#C99A2E"></circle></svg>
      <div><div class="brand-name">Gerardson</div><div class="brand-sub">CAPITAL</div></div>
    </div>
    <div class="pitch">
      <h2>Investir avec clarté.</h2>
      <p>Connectez-vous pour accéder à votre espace.</p>
    </div>
    <div class="legal">Gerardson Capital</div>
  </section>

  <main>
    <div class="box">
      <header>
        <h1>Connexion</h1>
        <p>Saisissez votre identifiant et votre mot de passe.</p>
      </header>

      {{notice}}

      <form method="post" action="/login">
        <input type="hidden" name="{{csrfName}}" value="{{csrfToken}}">
        <div class="field">
          <label for="username">Identifiant</label>
          <input id="username" name="username" type="text" autocomplete="username" autofocus required>
        </div>
        <div class="field">
          <label for="password">Mot de passe</label>
          <div class="password">
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="button" class="toggle" id="toggle" aria-label="Afficher le mot de passe" aria-pressed="false">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 10s3-5.5 8-5.5S18 10 18 10s-3 5.5-8 5.5S2 10 2 10z"></path><circle cx="10" cy="10" r="2.25"></circle></svg>
            </button>
          </div>
        </div>
        <button type="submit" class="submit">Se connecter</button>
      </form>

      <div class="help">Un problème de connexion ? Contactez le support.</div>
    </div>
  </main>
</div>
<script>
  (function () {
    var toggle = document.getElementById('toggle');
    var password = document.getElementById('password');
    toggle.addEventListener('click', function () {
      var visible = password.type === 'text';
      password.type = visible ? 'password' : 'text';
      toggle.setAttribute('aria-pressed', String(!visible));
      toggle.setAttribute('aria-label', visible ? 'Afficher le mot de passe' : 'Masquer le mot de passe');
    });
  })();
</script>
</body>
</html>
