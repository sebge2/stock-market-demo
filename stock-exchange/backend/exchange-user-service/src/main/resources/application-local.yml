spring:
  sql:
    init:
      mode: always
      data-locations: classpath:db/local/data.sql
  datasource:
    url: jdbc:h2:mem:exchange-user-db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    show-sql: false

