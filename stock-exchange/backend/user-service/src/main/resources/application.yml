spring:
  application:
    name: user-service
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  datasource:
    url: jdbc:h2:mem:userdb
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
server:
  port: 8086
  servlet:
    context-path: /api/user
  error:
    include-stacktrace: on_param
logging:
  level:
    root: INFO
    com.stockmarket: DEBUG
