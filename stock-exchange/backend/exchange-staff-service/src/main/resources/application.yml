spring:
  application:
    name: exchange-staff-service
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  datasource:
    url: jdbc:h2:mem:staffdb
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
server:
  port: 8086
  servlet:
    context-path: /api/staff
  error:
    include-stacktrace: on_param
logging:
  level:
    root: INFO
    be.sgerard.demo: DEBUG
