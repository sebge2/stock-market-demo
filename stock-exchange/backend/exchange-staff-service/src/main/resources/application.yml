spring:
  application:
    name: exchange-staff-service
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  datasource:
    url: jdbc:h2:mem:staffdb
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${EXCHANGE_USER_SERVICE_BASE_URL:http://localhost:8091}
          jwk-set-uri: ${EXCHANGE_USER_SERVICE_BASE_URL:http://localhost:8091}/oauth2/jwks

server:
  port: 8086
  servlet:
    context-path: /api/staff
  error:
    include-stacktrace: on_param

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    oauth:
      client-id: exchange-swagger-ui
      use-pkce-with-authorization-code-grant: true

exchange:
  base-domain: ${EXCHANGE_BASE_DOMAIN:sgxchange.local}
  user-service:
    base-url: user-service.${exchange.base-domain}

management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    service-url:
      defaultZone: eureka-service.${exchange.base-domain}

logging:
  level:
    root: INFO
    be.sgerard.demo: DEBUG
