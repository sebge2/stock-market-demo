spring:
  application:
    name: bank-portfolio-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${bank.user-service.base-url}
          jwk-set-uri: ${bank.user-service.base-url}/oauth2/jwks
  jpa:
    open-in-view: false

server:
  port: 8085
  servlet:
    context-path: /api/portfolio

bank:
  base-domain: ${BANK_BASE_DOMAIN:gerardson.local}
  user-service:
    base-url: user-service.${bank.base-domain}

springdoc:
  swagger-ui:
    oauth:
      client-id: portfolio-swagger-ui
      use-pkce-with-authorization-code-grant: true
      scopes: portfolio.read

eureka:
  client:
    service-url:
      defaultZone: eureka-service.${bank.base-domain}

logging:
  level:
    root: INFO
    be.sgerard.demo: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,threaddump
