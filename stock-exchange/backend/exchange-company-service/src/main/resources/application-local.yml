spring:
  sql:
    init:
      mode: always
  datasource:
    url: jdbc:h2:mem:exchange-company-db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    show-sql: false

exchange:
  user-service:
    base-url: ${EXCHANGE_USER_SERVICE_BASE_URL:http://localhost:8091}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8762/eureka/
