spring:
  application:
    name: company-service
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  datasource:
    url: jdbc:h2:mem:companydb
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
server:
  port: 8087
  servlet:
    context-path: /api/company
  error:
    include-stacktrace: on_param
logging:
  level:
    root: INFO
    be.sgerard.demo: DEBUG
