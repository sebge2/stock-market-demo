spring:
  application:
    name: bank-user-service
  jpa:
    open-in-view: false

server:
  port: 9000

bank:
  user-service:
    base-url: ${BANK_USER_SERVICE_BASE_URL:http://localhost:9000}
    cors:
      allowed-origins: ${BANK_USER_SERVICE_CORS_ALLOWED_ORIGINS:}
    jwt:
      key-id: ${BANK_USER_SERVICE_JWT_KEY_ID:}
      private-key: ${BANK_USER_SERVICE_JWT_PRIVATE_KEY:}
      public-key: ${BANK_USER_SERVICE_JWT_PUBLIC_KEY:}

springdoc:
  swagger-ui:
    oauth:
      client-id: swagger-ui
      use-pkce-with-authorization-code-grant: true
      scopes: user.read

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

logging:
  level:
    root: INFO
    be.sgerard.demo: DEBUG

management:
  endpoint:
    loggers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers,threaddump
