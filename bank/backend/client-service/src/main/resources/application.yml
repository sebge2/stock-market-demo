spring:
  application:
    name: client-service
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  datasource:
    url: jdbc:h2:mem:client-db
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true

server:
  port: 8084
  servlet:
    context-path: /api/client

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

logging:
  level:
    root: INFO
    com.stockmarket: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers,threaddump
