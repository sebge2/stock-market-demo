spring:
  application:
    name: user-service
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  datasource:
    url: jdbc:h2:mem:user-db
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true

server:
  port: 8083
  servlet:
    context-path: /api/user

logging:
  level:
    root: INFO
    com.stockmarket: DEBUG
