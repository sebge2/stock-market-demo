spring:
  application:
    name: bank-employee-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${bank.user-service.base-url}
          jwk-set-uri: ${bank.user-service.base-url}/oauth2/jwks
  jpa:
    open-in-view: false

server:
  port: 8083
  servlet:
    context-path: /api/employee

bank:
  base-domain: ${BANK_BASE_DOMAIN:}
  employee-service:
    cors:
      allowed-origins: ${BANK_EMPLOYEE_SERVICE_CORS_ALLOWED_ORIGINS:}
  user-service:
    base-url: ${BANK_USER_SERVICE_BASE_URL:}
    port: ${BANK_USER_SERVICE_PORT:}

springdoc:
  swagger-ui:
    oauth:
      client-id: employee-swagger-ui
      use-pkce-with-authorization-code-grant: true
      scopes: employee.read

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

logging:
  level:
    root: INFO
    be.sgerard.demo: DEBUG

management:
  endpoint:
    loggers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers,threaddump
