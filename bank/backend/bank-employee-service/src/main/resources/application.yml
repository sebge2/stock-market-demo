spring:
  application:
    name: bank-employee-service
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  datasource:
    url: jdbc:h2:mem:employee-db
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true

server:
  port: 8083
  servlet:
    context-path: /api/employee

logging:
  level:
    root: INFO
    be.sgerard.demo: DEBUG
