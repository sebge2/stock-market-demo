spring:
  application:
    name: bank-service
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true

server:
  port: 8081
  servlet:
    context-path: /api/bank

logging:
  level:
    root: INFO
    com.stockmarket: DEBUG
