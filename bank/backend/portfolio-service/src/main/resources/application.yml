spring:
  application:
    name: portfolio-service
  jpa:
    open-in-view: false

server:
  port: 8085
  servlet:
    context-path: /api/portfolio

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

logging:
  level:
    root: INFO
    be.sgerard.demo: DEBUG

management:
  endpoint:
    loggers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers,threaddump
